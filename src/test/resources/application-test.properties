# Test-only in-memory database; never connects to the user's PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:apiusuarios_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=${random.uuid}${random.uuid}
app.storage.local-directory=target/test-local-uploads
app.storage.s3.bucket=test-bucket
app.storage.s3.region=us-east-1
spring.servlet.multipart.location=target/test-multipart
