spring.application.name=apiusuarios

# Existing local defaults, with all credentials supplied externally.
# Standard SPRING_DATASOURCE_* variables can also override these properties.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/api_usuarios}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.storage.local-directory=${UPLOAD_DIRECTORY:uploads}
