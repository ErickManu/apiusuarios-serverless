# Activated by StreamLambdaHandler; no local database/credential fallbacks in Lambda.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.region=${AWS_REGION}
spring.servlet.multipart.location=/tmp
# Leave room for base64 and the API Gateway event in Lambda's 6 MB request limit.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:1MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:4MB}
