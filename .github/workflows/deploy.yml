
name: Backend CI/CD

on:
  workflow_dispatch:
    inputs:
      desplegar:
        description: "Aplicar cambios en AWS"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apiusuarios-terraform-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Terraform
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      TF_VAR_database_username: ${{ secrets.DATABASE_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: default

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Build Lambda
        run: ./mvnw --batch-mode --no-transfer-progress -Plambda -DskipTests package

      - name: Verify Lambda artifact
        run: |
          test -s target/apiusuarios-0.0.1-SNAPSHOT-lambda.jar

      - name: Verify notification Lambda
        run: |
          test -s notification-lambda/lambda_function.py
          python3 -m py_compile notification-lambda/lambda_function.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

          terraform show -no-color tfplan > plan-review.txt

      - name: Terraform Apply
        if: ${{ inputs.desplegar == true }}
        working-directory: terraform
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            tfplan

      - name: Verify deployed Lambda
        if: ${{ inputs.desplegar == true }}
        working-directory: terraform
        run: |
          lambda_function_name="$(terraform output -raw lambda_function_name)"

          aws lambda wait function-updated \
            --function-name "$lambda_function_name"

          aws lambda get-function-configuration \
            --function-name "$lambda_function_name" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}' \
            --output table

      
      - name: Verify notification infrastructure
        if: ${{ inputs.desplegar == true }}
        working-directory: terraform
        run: |
          echo "Checking notification infrastructure..."

          terraform state show aws_sns_topic.notifications
          terraform state show aws_sqs_queue.notifications
          terraform state show aws_sqs_queue.notifications_dlq
          terraform state show aws_lambda_function.notification_lambda
          terraform state show aws_lambda_event_source_mapping.notification_sqs

          echo "Notification infrastructure verified in Terraform state."


      - name: Deployment summary
        if: ${{ inputs.desplegar == true }}
        run: |
          echo "### AWS Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform Apply completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Backend Lambda updated." >> "$GITHUB_STEP_SUMMARY"
          echo "Notification infrastructure verification executed." >> "$GITHUB_STEP_SUMMARY"

      - name: Plan summary
        if: ${{ inputs.desplegar != true }}
        run: |
          echo "### Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation and plan completed." >> "$GITHUB_STEP_SUMMARY"
          echo "No Terraform Apply was executed." >> "$GITHUB_STEP_SUMMARY"
          echo "Review the plan before enabling deployment." >> "$GITHUB_STEP_SUMMARY"
